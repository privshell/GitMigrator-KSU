<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Git Migrator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>

<div id="jobbar" class="jobbar" hidden><i class="pulse"></i><span id="jobbarText">عملیات در حال اجرا</span><b>مشاهده ›</b></div>

<nav class="nav" id="nav">
  <button data-p="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>خانه</span></button>
  <button data-p="files"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>فایل‌ها</span></button>
  <button data-p="repos"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg><span>مخزن‌ها</span></button>
  <button data-p="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><span>دستیار</span></button>
</nav>

<div id="sheetWrap" class="sheetwrap" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
